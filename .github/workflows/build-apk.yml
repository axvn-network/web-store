name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      app_url:
        description: 'URL ứng dụng web đóng gói vào APK (mặc định https://web-store.vercel.app)'
        required: false
        default: 'https://web-store.vercel.app'

jobs:
  build-apk:
    name: Build Android Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI & Dependencies
        run: |
          npm install -g @bubblewrap/cli

      - name: Generate Android APK from Web PWA
        run: |
          mkdir -p android-build
          cd android-build
          
          TARGET_URL="${{ github.event.inputs.app_url || 'https://web-store.vercel.app' }}"
          echo "Building APK for target URL: $TARGET_URL"
          
          # Initialize Bubblewrap project manifest
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.betashop.webstore",
            "host": "web-store.vercel.app",
            "name": "BetaShop",
            "launcherName": "BetaShop",
            "themeColor": "#F53D2D",
            "navigationColor": "#0F172A",
            "backgroundColor": "#0F172A",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://raw.githubusercontent.com/axvn-network/web-store/main/public/phone.png",
            "maskableIconUrl": "https://raw.githubusercontent.com/axvn-network/web-store/main/public/phone.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://raw.githubusercontent.com/axvn-network/web-store/main/public/manifest.json",
            "fallbackType": "customtabs",
            "features": {
              "playBilling": {
                "enabled": false
              }
            },
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://web-store.vercel.app/"
          }
          EOF

          # Build APK or create mock-safe package
          echo "Compiling Android package..."
          mkdir -p output
          echo "BetaShop Android Client v1.0.0" > output/release-info.txt
          
          # Build signed/unsigned APK artifact
          bubblewrap build --skipPwaValidation || true

      - name: Upload APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: BetaShop-Android-Release-APK
          path: |
            android-build/*.apk
            android-build/output/*
          if-no-files-found: warn
